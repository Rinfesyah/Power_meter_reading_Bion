version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dc_ops_postgres
    restart: always
    environment:
      POSTGRES_DB: power_meter_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/power_meter_db
    depends_on:
      - postgres
    volumes:
      # Sinkronisasi kode backend untuk mempermudah pengembangan (live reload)
      - ./backend:/app
      # Petakan database yang berada di luar folder dc-ops-ocr (sibling folder)
      # agar terbaca di dalam root directory container sesuai pathing python (/database)
      - ../database:/database

  frontend-dashboard:
    build:
      context: ./frontend-dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Sinkronisasi kode frontend-dashboard
      - ./frontend-dashboard:/app
      # Menghindari node_modules container tertimpa oleh folder lokal Windows
      - /app/node_modules

  frontend-mobile:
    build:
      context: ./frontend-mobile
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes:
      # Sinkronisasi kode frontend-mobile
      - ./frontend-mobile:/app
      # Menghindari node_modules container tertimpa oleh folder lokal Windows
      - /app/node_modules

volumes:
  postgres_data:

